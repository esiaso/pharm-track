name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmtrack
          POSTGRES_PASSWORD: pharmtrack
          POSTGRES_DB: pharmtrack_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmtrack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://pharmtrack:pharmtrack@localhost:5432/pharmtrack_e2e
      DATABASE_URL: postgresql://pharmtrack:pharmtrack@localhost:5432/pharmtrack_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run typecheck
      - run: npx jest --runInBand
        working-directory: apps/api
      - run: npm run build -w apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
