name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmtrack
          POSTGRES_PASSWORD: pharmtrack
          POSTGRES_DB: pharmtrack_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmtrack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://pharmtrack:pharmtrack@localhost:5432/pharmtrack_e2e
      DATABASE_URL: postgresql://pharmtrack:pharmtrack@localhost:5432/pharmtrack_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run typecheck
      - run: npx jest --runInBand
        working-directory: apps/api
      - run: npm run build -w apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  browser:
    # Playwright tests of the web app against the built API and web app (see playwright.config.ts).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pharmtrack
          POSTGRES_PASSWORD: pharmtrack
          POSTGRES_DB: pharmtrack_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmtrack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://pharmtrack:pharmtrack@localhost:5432/pharmtrack_browser
      DATABASE_URL: postgresql://pharmtrack:pharmtrack@localhost:5432/pharmtrack_browser
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t pharmtrack-api .
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t pharmtrack-web .
      - name: Start the stack and check health
        run: |
          # --wait returns once every service reports healthy (or fails if one does not).
          NODE_ENV=development docker compose up -d --no-build --wait --wait-timeout 120
          curl -fsS localhost:3000/health/ready
          curl -fsS -o /dev/null localhost:3001/
          docker compose logs api > api.log
          grep -q "Applying migration" api.log
      - name: Logs on failure
        if: failure()
        run: docker compose logs
